<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧸 Baby Choice Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Segoe UI', sans-serif; background: #0f172a; min-height: 100vh; color: #e2e8f0; }

/* Header */
.header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #334155; }
.header-title { color: white; font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
.header-title span { color: #f59e0b; }
.header-btns { display: flex; gap: 6px; }
.btn { border: none; padding: 8px 14px; border-radius: 20px; font-weight: 700; cursor: pointer; font-size: 12px; color: white; transition: all 0.2s; active:scale-95; }
.btn:active { transform: scale(0.95); }
.btn-yellow { background: linear-gradient(135deg, #f59e0b, #d97706); }
.btn-green { background: linear-gradient(135deg, #10b981, #059669); }
.btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); }

/* Tabs */
.tabs { display: flex; background: #1e293b; border-bottom: 1px solid #334155; }
.tab { flex: 1; padding: 14px 8px; border: none; cursor: pointer; font-weight: 700; font-size: 13px; background: transparent; color: #64748b; border-bottom: 3px solid transparent; transition: all 0.2s; }
.tab.active { color: #f59e0b; border-bottom: 3px solid #f59e0b; background: rgba(245,158,11,0.05); }

.content { padding: 12px; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
.stat-card { background: linear-gradient(135deg, #1e293b, #263348); border-radius: 14px; padding: 12px 8px; text-align: center; border: 1px solid #334155; }
.stat-val { font-size: 22px; font-weight: 800; }
.stat-lbl { font-size: 10px; color: #64748b; margin-top: 2px; font-weight: 600; }

/* Order Card */
.order-card { background: linear-gradient(135deg, #1e293b, #1a2740); border-radius: 18px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.order-num { color: #64748b; font-size: 12px; font-weight: 700; background: #0f172a; padding: 3px 8px; border-radius: 6px; }
.order-time { color: #64748b; font-size: 11px; }
.badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }
.badge-pending { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
.badge-confirmed { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
.badge-delivered { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.badge-cancelled { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
.badge-retry { background: rgba(139,92,246,0.15); color: #a78bfa; border: 1px solid rgba(139,92,246,0.3); }

.cust-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #d97706); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 18px; flex-shrink: 0; }
.cust-name { font-weight: 800; font-size: 17px; color: #f1f5f9; }

.phone-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #0f172a; padding: 10px 12px; border-radius: 10px; }
.phone-num { color: #94a3b8; font-size: 14px; font-weight: 600; }
.call-btn { background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; box-shadow: 0 2px 10px rgba(16,185,129,0.4); }
.call-btn:active { transform: scale(0.95); }

.address { color: #94a3b8; font-size: 13px; margin-bottom: 12px; padding: 8px 12px; background: #0f172a; border-radius: 10px; border-left: 3px solid #334155; }

.price-row { display: flex; gap: 8px; margin-bottom: 14px; font-size: 11px; color: #64748b; align-items: center; flex-wrap: wrap; }
.price-tag { background: #0f172a; padding: 4px 8px; border-radius: 6px; border: 1px solid #334155; }
.total-tag { color: #f87171; font-weight: 800; font-size: 16px; margin-left: auto; }

.actions { display: flex; gap: 8px; align-items: center; }
.copy-btn { background: #0f172a; color: #94a3b8; border: 1px solid #334155; padding: 9px 14px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 700; white-space: nowrap; transition: all 0.2s; }
.copy-btn:active { transform: scale(0.95); }
.copy-btn.copied { background: #10b981; color: white; border-color: #10b981; }
.status-sel { flex: 1; padding: 9px 10px; border-radius: 10px; border: 1px solid #334155; font-size: 12px; background: #0f172a; color: #e2e8f0; cursor: pointer; font-weight: 600; }
.del-btn { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 16px; flex-shrink: 0; transition: all 0.2s; }
.del-btn:active { transform: scale(0.95); }

.empty { text-align: center; padding: 50px 20px; color: #64748b; background: #1e293b; border-radius: 16px; border: 1px solid #334155; }

/* Images */
.upload-box { background: #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; }
.upload-box h3 { color: #f1f5f9; margin-bottom: 12px; font-size: 16px; }
.upload-input { width: 100%; padding: 12px; border: 2px dashed #334155; border-radius: 10px; background: #0f172a; color: #94a3b8; margin-bottom: 10px; cursor: pointer; }
.img-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.img-card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
.img-card img { width: 100%; height: 120px; object-fit: cover; }
.img-footer { padding: 8px; }
.url-btn { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 7px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 700; }

/* Settings */
.settings-card { background: #1e293b; border-radius: 16px; padding: 16px; border: 1px solid #334155; }
.settings-card h3 { color: #f1f5f9; margin-bottom: 16px; font-size: 16px; }
.field-lbl { display: block; font-weight: 700; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
.field-inp { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 10px; font-size: 15px; margin-bottom: 12px; background: #0f172a; color: #f1f5f9; }
.field-inp:focus { outline: none; border-color: #f59e0b; }
.save-btn { width: 100%; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(245,158,11,0.3); }
.price-info { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 13px; color: #34d399; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🧸 Baby <span>Choice</span></div>
  <div class="header-btns">
    <button class="btn btn-yellow" onclick="loadOrders()">🔄 <span id="badge" style="display:none;background:rgba(255,255,255,0.3);border-radius:10px;padding:1px 6px;margin-left:2px;font-size:11px;"></span></button>
    <button class="btn btn-green" onclick="downloadCSV()">⬇️ CSV</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('orders',this)">🛒 অর্ডার</button>
  <button class="tab" onclick="showTab('images',this)">🖼️ ছবি</button>
  <button class="tab" onclick="showTab('settings',this)">⚙️ সেটিংস</button>
</div>

<div class="content">
  <!-- Orders -->
  <div id="pane-orders" class="tab-pane active">
    <div class="stats">
      <div class="stat-card"><div class="stat-val" id="sTotal" style="color:#60a5fa">0</div><div class="stat-lbl">মোট অর্ডার</div></div>
      <div class="stat-card"><div class="stat-val" id="sToday" style="color:#34d399">0</div><div class="stat-lbl">আজকের</div></div>
      <div class="stat-card"><div class="stat-val" id="sRevenue" style="color:#f59e0b; font-size:15px;">৳0</div><div class="stat-lbl">মোট আয়</div></div>
    </div>
    <div id="ordersList"><div class="empty">⏳ লোড হচ্ছে...</div></div>
  </div>

  <!-- Images -->
  <div id="pane-images" class="tab-pane">
    <div class="upload-box">
      <h3>📸 নতুন ছবি আপলোড</h3>
      <input type="file" accept="image/*" id="imgFile" class="upload-input">
      <button class="save-btn" onclick="uploadImage()" style="padding:12px;">✅ আপলোড করুন</button>
    </div>
    <div class="img-grid" id="imgGallery"></div>
  </div>

  <!-- Settings -->
  <div id="pane-settings" class="tab-pane">
    <div class="settings-card">
      <h3>💰 মূল্য সেটিংস</h3>
      <div class="price-info" id="priceInfo">লোড হচ্ছে...</div>
      <label class="field-lbl">পণ্যের নাম</label>
      <input class="field-inp" id="fName" type="text">
      <label class="field-lbl">অফার মূল্য (৳)</label>
      <input class="field-inp" id="fPrice" type="number">
      <label class="field-lbl">পুরোনো মূল্য (৳)</label>
      <input class="field-inp" id="fOldPrice" type="number">
      <label class="field-lbl">ডেলিভারি চার্জ (৳)</label>
      <input class="field-inp" id="fDelivery" type="number">
      <button class="save-btn" onclick="savePrice()">✅ আপডেট করুন</button>
    </div>
  </div>
</div>

<script>
const API = window.location.origin + '/api';
let orders = [];
const STATUSES = ['Pending','Confirmed','Retry','Delivered','Cancelled'];
const BADGE_CLASS = { Pending:'badge-pending', Confirmed:'badge-confirmed', Delivered:'badge-delivered', Cancelled:'badge-cancelled', Retry:'badge-retry' };

document.addEventListener('DOMContentLoaded', () => { loadOrders(); loadImages(); loadPrice(); setInterval(loadOrders, 30000); });

function showTab(name, el) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('pane-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'images') loadImages();
  if (name === 'settings') loadPrice();
}

async function loadOrders() {
  try {
    const r = await fetch(`${API}/orders`);
    const d = await r.json();
    if (!d.success) return;
    orders = d.orders;
    const today = new Date().toDateString();
    document.getElementById('sTotal').textContent = orders.length;
    document.getElementById('sToday').textContent = orders.filter(o => new Date(o.createdAt).toDateString() === today).length;
    document.getElementById('sRevenue').textContent = '৳' + orders.reduce((s,o) => s+(o.totalAmount||0),0).toLocaleString();
    const pending = orders.filter(o => !o.status || o.status==='Pending').length;
    const b = document.getElementById('badge');
    b.style.display = pending > 0 ? 'inline' : 'none';
    b.textContent = pending;
    renderOrders();
  } catch(e) { document.getElementById('ordersList').innerHTML = '<div class="empty">❌ লোড করতে সমস্যা</div>'; }
}

function getBadgeClass(st) { return BADGE_CLASS[st] || 'badge-pending'; }

function renderOrders() {
  const el = document.getElementById('ordersList');
  if (!orders.length) { el.innerHTML = '<div class="empty">📭 কোন অর্ডার নেই</div>'; return; }
  el.innerHTML = orders.map((o, i) => {
    const st = o.status || 'Pending';
    const dt = new Date(o.createdAt);
    const num = orders.length - i;
    const dateStr = dt.toLocaleDateString('bn-BD') + ' ' + dt.toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'});
    return `<div class="order-card">
      <div class="order-top">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="order-num">#${num}</span>
          <span class="badge ${getBadgeClass(st)}">${st}</span>
        </div>
        <span class="order-time">${dateStr}</span>
      </div>
      <div class="cust-row">
        <div class="avatar">${(o.customerName||'?')[0].toUpperCase()}</div>
        <div class="cust-name">${o.customerName||'নাম নেই'}</div>
      </div>
      <div class="phone-row">
        <span class="phone-num">📞 ${o.phoneNumber||''}</span>
        <a href="tel:${(o.phoneNumber||'').replace(/\s/g,'')}" class="call-btn">📲 কল করুন</a>
      </div>
      <div class="address">📍 ${o.address||''}</div>
      <div class="price-row">
        <span class="price-tag">${o.quantity} সেট</span>
        <span class="price-tag">পণ্য: ৳${o.productPrice}</span>
        <span class="price-tag">ডেলিভারি: ${o.deliveryCharge==0?'ফ্রি':'৳'+o.deliveryCharge}</span>
        <span class="total-tag">৳${o.totalAmount}</span>
      </div>
      <div class="actions">
        <button class="copy-btn" id="copy-${o.id}" onclick="copyOrder('${o.id}')">📋 Copy</button>
        <select class="status-sel" onchange="changeStatus('${o.id}',this.value)">
          ${STATUSES.map(s=>`<option value="${s}"${s===st?' selected':''}>${s}</option>`).join('')}
        </select>
        <button class="del-btn" onclick="delOrder('${o.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

async function changeStatus(id, status) {
  await fetch(`${API}/orders/${id}/status`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status}) });
  orders = orders.map(o => o.id===id ? {...o,status} : o);
  renderOrders();
}

async function delOrder(id) {
  if (!confirm('মুছে দিতে চান?')) return;
  await fetch(`${API}/orders/${id}`, {method:'DELETE'});
  orders = orders.filter(o => o.id!==id);
  renderOrders();
}

function copyOrder(id) {
  const o = orders.find(x=>x.id===id);
  if (!o) return;
  navigator.clipboard.writeText(`${o.customerName}\n${o.phoneNumber}\n${o.address}`);
  const btn = document.getElementById('copy-'+id);
  if (btn) { btn.textContent = '✓ Copied'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000); }
}

function downloadCSV() {
  if (!orders.length) return alert('কোন অর্ডার নেই');
  const rows = [['ID','নাম','ফোন','ঠিকানা','পরিমাণ','মোট','স্ট্যাটাস','তারিখ'],
    ...orders.map(o=>[o.id,o.customerName,o.phoneNumber,o.address,o.quantity,o.totalAmount,o.status||'Pending',new Date(o.createdAt).toLocaleDateString()].map(v=>`"${v}"`))
  ].map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+rows],{type:'text/csv;charset=utf-8;'}));
  a.download = 'orders.csv'; a.click();
}

async function loadImages() {
  try {
    const r = await fetch(`${API}/images`);
    const d = await r.json();
    const g = document.getElementById('imgGallery');
    if (!d.success||!d.images.length) { g.innerHTML='<div class="empty" style="grid-column:1/-1">কোন ছবি নেই</div>'; return; }
    g.innerHTML = d.images.map(img=>`<div class="img-card"><img src="${img.url}"><div class="img-footer"><button class="url-btn" onclick="copyUrl('${img.url}')">🔗 URL কপি</button></div></div>`).join('');
  } catch(e) {}
}

function copyUrl(url) { navigator.clipboard.writeText(window.location.origin+url); }

async function uploadImage() {
  const f = document.getElementById('imgFile').files[0];
  if (!f) return alert('ছবি নির্বাচন করুন');
  const fd = new FormData(); fd.append('image',f);
  const r = await fetch(`${API}/upload-image`,{method:'POST',body:fd});
  const d = await r.json();
  if (d.success) { loadImages(); }
  document.getElementById('imgFile').value='';
}

async function loadPrice() {
  try {
    const r = await fetch(`${API}/price`);
    const d = await r.json();
    if (d.success) {
      document.getElementById('fName').value = d.productName||'';
      document.getElementById('fPrice').value = d.price||'';
      document.getElementById('fOldPrice').value = d.originalPrice||'';
      document.getElementById('fDelivery').value = d.deliveryCharge||'';
      document.getElementById('priceInfo').innerHTML = `বর্তমান: <b>৳${d.price}</b> | পুরোনো: ৳${d.originalPrice} | ডেলিভারি: ৳${d.deliveryCharge} | <b>সর্বমোট: ৳${d.price+d.deliveryCharge}</b>`;
    }
  } catch(e) {}
}

async function savePrice() {
  const body = { productName:document.getElementById('fName').value, price:document.getElementById('fPrice').value, originalPrice:document.getElementById('fOldPrice').value, deliveryCharge:document.getElementById('fDelivery').value };
  const r = await fetch(`${API}/price`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d = await r.json();
  if (d.success) { loadPrice(); alert('✅ আপডেট হয়েছে!'); }
}
</script>
</body>
</html>
