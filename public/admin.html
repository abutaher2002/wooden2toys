<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অ্যাডমিন প্যানেল</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: sans-serif; background: #f1f5f9; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1e293b, #334155); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
.header-title { color: white; font-weight: 700; font-size: 18px; }
.header-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: none; padding: 8px 12px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 12px; color: white; }
.btn-orange { background: #f59e0b; } .btn-green { background: #10b981; } .btn-red { background: #ef4444; }
.tabs { display: flex; background: white; border-bottom: 1px solid #e2e8f0; }
.tab { flex: 1; padding: 14px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; background: #f8fafc; color: #64748b; border-bottom: 3px solid transparent; }
.tab.active { background: white; color: #f59e0b; border-bottom: 3px solid #f59e0b; }
.content { padding: 12px; }
.tab-pane { display: none; } .tab-pane.active { display: block; }
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
.stat-card { background: white; border-radius: 12px; padding: 12px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.stat-val { font-size: 20px; font-weight: 700; } .stat-lbl { font-size: 11px; color: #64748b; }
.order-card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.cust-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: #f59e0b; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px; flex-shrink: 0; }
.cust-name { font-weight: 700; font-size: 16px; color: #1e293b; }
.phone-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.call-link { background: #10b981; color: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; text-decoration: none; }
.address { color: #475569; font-size: 13px; margin-bottom: 10px; }
.price-row { display: flex; gap: 10px; margin-bottom: 12px; font-size: 12px; color: #64748b; align-items: center; flex-wrap: wrap; }
.total { color: #ef4444; font-weight: 700; font-size: 15px; margin-left: auto; }
.actions { display: flex; gap: 8px; align-items: center; }
.copy-btn { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }
.status-sel { flex: 1; padding: 6px 8px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 11px; background: white; cursor: pointer; }
.del-btn { background: #fee2e2; color: #ef4444; border: none; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 16px; flex-shrink: 0; }
.empty { text-align: center; padding: 40px; color: #64748b; background: white; border-radius: 12px; }
.upload-box { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.img-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.img-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.img-card img { width: 100%; height: 120px; object-fit: cover; }
.img-footer { padding: 8px; }
.url-btn { width: 100%; background: #10b981; color: white; border: none; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.settings-card { background: white; border-radius: 16px; padding: 16px; }
.field-lbl { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; color: #374151; }
.field-inp { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
.save-btn { width: 100%; background: linear-gradient(135deg,#f59e0b,#d97706); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
.price-info { background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 10px; margin-bottom: 16px; font-size: 13px; color: #166534; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🧸 অ্যাডমিন প্যানেল</div>
  <div class="header-btns">
    <button class="btn btn-orange" onclick="loadOrders()">🔄 রিফ্রেশ<span id="badge" style="display:none;background:red;border-radius:50%;padding:0 5px;margin-left:4px;font-size:11px;"></span></button>
    <button class="btn btn-green" onclick="downloadCSV()">⬇️ Download</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('orders',this)">🛒 অর্ডার</button>
  <button class="tab" onclick="showTab('images',this)">🖼️ ছবি</button>
  <button class="tab" onclick="showTab('settings',this)">⚙️ সেটিংস</button>
</div>

<div class="content">

  <!-- Orders -->
  <div id="pane-orders" class="tab-pane active">
    <div class="stats">
      <div class="stat-card"><div class="stat-val" id="sTotal" style="color:#3b82f6">-</div><div class="stat-lbl">মোট অর্ডার</div></div>
      <div class="stat-card"><div class="stat-val" id="sToday" style="color:#10b981">-</div><div class="stat-lbl">আজকের</div></div>
      <div class="stat-card"><div class="stat-val" id="sRevenue" style="color:#f59e0b">-</div><div class="stat-lbl">মোট আয়</div></div>
    </div>
    <div id="ordersList"><div class="empty">লোড হচ্ছে...</div></div>
  </div>

  <!-- Images -->
  <div id="pane-images" class="tab-pane">
    <div class="upload-box">
      <h3 style="margin-bottom:12px;color:#1e293b;">নতুন ছবি আপলোড</h3>
      <input type="file" accept="image/*" id="imgFile" style="width:100%;padding:12px;border:2px dashed #e2e8f0;border-radius:8px;margin-bottom:10px;">
      <button class="btn btn-green" style="width:100%;padding:12px;border-radius:8px;font-size:14px;" onclick="uploadImage()">আপলোড করুন</button>
    </div>
    <div class="img-grid" id="imgGallery"></div>
  </div>

  <!-- Settings -->
  <div id="pane-settings" class="tab-pane">
    <div class="settings-card">
      <h3 style="margin-bottom:16px;color:#1e293b;">💰 মূল্য সেটিংস</h3>
      <div class="price-info" id="priceInfo">লোড হচ্ছে...</div>
      <label class="field-lbl">পণ্যের নাম</label>
      <input class="field-inp" id="fName" type="text">
      <label class="field-lbl">অফার মূল্য (৳)</label>
      <input class="field-inp" id="fPrice" type="number">
      <label class="field-lbl">পুরোনো মূল্য (৳)</label>
      <input class="field-inp" id="fOldPrice" type="number">
      <label class="field-lbl">ডেলিভারি চার্জ (৳)</label>
      <input class="field-inp" id="fDelivery" type="number">
      <button class="save-btn" onclick="savePrice()">✅ আপডেট করুন</button>
    </div>
  </div>

</div>

<script>
const API = window.location.origin + '/api';
let orders = [];

const SC = { Pending:'#fef3c7', Confirmed:'#dbeafe', Retry:'#ede9fe', Delivered:'#d1fae5', Cancelled:'#fee2e2' };
const TC = { Pending:'#d97706', Confirmed:'#1d4ed8', Retry:'#7c3aed', Delivered:'#065f46', Cancelled:'#dc2626' };
const STATUSES = ['Pending','Confirmed','Retry','Delivered','Cancelled'];

document.addEventListener('DOMContentLoaded', () => { loadOrders(); loadImages(); loadPrice(); setInterval(loadOrders, 30000); });

function showTab(name, el) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('pane-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'images') loadImages();
  if (name === 'settings') loadPrice();
}

async function loadOrders() {
  try {
    const r = await fetch(`${API}/orders`);
    const d = await r.json();
    if (!d.success) return;
    orders = d.orders;
    const today = new Date().toDateString();
    document.getElementById('sTotal').textContent = orders.length;
    document.getElementById('sToday').textContent = orders.filter(o => new Date(o.createdAt).toDateString() === today).length;
    document.getElementById('sRevenue').textContent = '৳' + orders.reduce((s,o) => s+(o.totalAmount||0),0).toLocaleString();
    const pending = orders.filter(o => !o.status || o.status==='Pending').length;
    const b = document.getElementById('badge');
    b.style.display = pending > 0 ? 'inline' : 'none';
    b.textContent = pending;
    renderOrders();
  } catch(e) { document.getElementById('ordersList').innerHTML = '<div class="empty">লোড করতে সমস্যা হয়েছে</div>'; }
}

function renderOrders() {
  const el = document.getElementById('ordersList');
  if (!orders.length) { el.innerHTML = '<div class="empty">কোন অর্ডার নেই</div>'; return; }
  el.innerHTML = orders.map((o, i) => {
    const st = o.status || 'Pending';
    const dt = new Date(o.createdAt);
    const num = orders.length - i;
    return `<div class="order-card">
      <div class="order-top">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="color:#64748b;font-size:13px;">#${num}</span>
          <span class="badge" style="background:${SC[st]};color:${TC[st]}">${st}</span>
        </div>
        <span style="color:#94a3b8;font-size:12px;">${dt.toLocaleDateString('bn-BD')} ${dt.toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'})}</span>
      </div>
      <div class="cust-row">
        <div class="avatar">${(o.customerName||'?')[0]}</div>
        <div class="cust-name">${o.customerName||'নাম নেই'}</div>
      </div>
      <div class="phone-row">
        <span style="color:#475569;font-size:14px;">📞 ${o.phoneNumber||''}</span>
        <a href="tel:${o.phoneNumber}" class="call-link">📞 কল</a>
      </div>
      <div class="address">📍 ${o.address||''}</div>
      <div class="price-row">
        <span>${o.quantity} সেট</span>
        <span>পণ্য: ৳${o.productPrice}</span>
        <span>ডেলিভারি: ${o.deliveryCharge==0?'ফ্রি':'৳'+o.deliveryCharge}</span>
        <span class="total">৳${o.totalAmount}</span>
      </div>
      <div class="actions">
        <button class="copy-btn" onclick="copyOrder('${o.id}')">📋 Copy All</button>
        <select class="status-sel" onchange="changeStatus('${o.id}',this.value)">
          ${STATUSES.map(s=>`<option value="${s}"${s===st?' selected':''}>${s}</option>`).join('')}
        </select>
        <button class="del-btn" onclick="delOrder('${o.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

async function changeStatus(id, status) {
  await fetch(`${API}/orders/${id}/status`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status}) });
  orders = orders.map(o => o.id===id ? {...o,status} : o);
  renderOrders();
}

async function delOrder(id) {
  if (!confirm('মুছে দিতে চান?')) return;
  await fetch(`${API}/orders/${id}`, {method:'DELETE'});
  orders = orders.filter(o => o.id!==id);
  renderOrders();
}

function copyOrder(id) {
  const o = orders.find(x=>x.id===id);
  if (!o) return;
  navigator.clipboard.writeText(`নাম: ${o.customerName}\nফোন: ${o.phoneNumber}\nঠিকানা: ${o.address}\nপরিমাণ: ${o.quantity} সেট\nমোট: ৳${o.totalAmount}`);
}

function downloadCSV() {
  if (!orders.length) return alert('কোন অর্ডার নেই');
  const rows = [['ID','নাম','ফোন','ঠিকানা','পরিমাণ','মোট','স্ট্যাটাস','তারিখ'],
    ...orders.map(o=>[o.id,o.customerName,o.phoneNumber,o.address,o.quantity,o.totalAmount,o.status||'Pending',new Date(o.createdAt).toLocaleDateString()].map(v=>`"${v}"`))
  ].map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+rows],{type:'text/csv;charset=utf-8;'}));
  a.download = 'orders.csv'; a.click();
}

async function loadImages() {
  try {
    const r = await fetch(`${API}/images`);
    const d = await r.json();
    const g = document.getElementById('imgGallery');
    if (!d.success||!d.images.length) { g.innerHTML='<div class="empty" style="grid-column:1/-1">কোন ছবি নেই</div>'; return; }
    g.innerHTML = d.images.map(img=>`<div class="img-card"><img src="${img.url}"><div class="img-footer"><button class="url-btn" onclick="copyUrl('${img.url}')">🔗 URL কপি</button></div></div>`).join('');
  } catch(e) {}
}

function copyUrl(url) { navigator.clipboard.writeText(window.location.origin+url); }

async function uploadImage() {
  const f = document.getElementById('imgFile').files[0];
  if (!f) return alert('ছবি নির্বাচন করুন');
  const fd = new FormData(); fd.append('image',f);
  const r = await fetch(`${API}/upload-image`,{method:'POST',body:fd});
  const d = await r.json();
  if (d.success) { loadImages(); }
  document.getElementById('imgFile').value='';
}

async function loadPrice() {
  try {
    const r = await fetch(`${API}/price`);
    const d = await r.json();
    if (d.success) {
      document.getElementById('fName').value = d.productName||'';
      document.getElementById('fPrice').value = d.price||'';
      document.getElementById('fOldPrice').value = d.originalPrice||'';
      document.getElementById('fDelivery').value = d.deliveryCharge||'';
      document.getElementById('priceInfo').innerHTML = `বর্তমান: <b>৳${d.price}</b> | পুরোনো: ৳${d.originalPrice} | ডেলিভারি: ৳${d.deliveryCharge} | <b>সর্বমোট: ৳${d.price+d.deliveryCharge}</b>`;
    }
  } catch(e) {}
}

async function savePrice() {
  const body = { productName:document.getElementById('fName').value, price:document.getElementById('fPrice').value, originalPrice:document.getElementById('fOldPrice').value, deliveryCharge:document.getElementById('fDelivery').value };
  const r = await fetch(`${API}/price`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d = await r.json();
  if (d.success) { loadPrice(); }
}
</script>
</body>
</html>
